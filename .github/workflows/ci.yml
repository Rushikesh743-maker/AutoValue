name: AutoValue CI/CD Pipeline

on:
  push:
    branches: [ main, master, "phase**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests & Production Security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: testing
          DATABASE_URL: sqlite:///:memory:
          ACTIVE_MODEL_VERSION: v002
          AUTH_SECRET: ci-test-secret-key-for-jwt-signing-12345
        run: |
          python -m pytest -v

      - name: Validate Alembic Migrations (Upgrade and Downgrade)
        env:
          DATABASE_URL: sqlite:///data/ci_migration_test.db
        run: |
          alembic upgrade head
          alembic check || alembic heads
          alembic downgrade -1
          alembic upgrade head

  frontend-build:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Run TypeScript & Vite Production Build
        working-directory: ./frontend
        run: |
          npm run build

  docker-validate-and-build:
    name: Docker Configuration & Image Builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          tags: autovalue-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: docker/Dockerfile.frontend
          push: false
          tags: autovalue-frontend:ci
